services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alonoon
      POSTGRES_PASSWORD: alonoon
      POSTGRES_DB: alonoon
    ports:
      - "5432:5432"
    volumes:
      - alo_noon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alonoon -d alonoon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - alo_noon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alo_noon_postgres:
  alo_noon_redis:
