services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alo_noon
      POSTGRES_USER: alo_noon
      POSTGRES_PASSWORD: alo_noon
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alo_noon -d alo_noon']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - alo-noon-postgres:/var/lib/postgresql/data

volumes:
  alo-noon-postgres:
