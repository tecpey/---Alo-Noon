# pnpm workspace configuration for Alo Noon monorepo
# See: https://pnpm.io/pnpm-workspace.yaml
packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@eslint/plugin-kit@0.2.8': '0.3.4'
  'brace-expansion@1.1.16': '1.1.17'
  'postcss@8.4.31': '8.5.25'
  'sharp@0.34.5': '0.35.3'
  typescript: '^5.8.3'
  'uuid@7.0.3': '11.1.1'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
