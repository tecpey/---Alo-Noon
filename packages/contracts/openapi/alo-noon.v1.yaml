openapi: 3.1.0
info:
  title: Alo Noon API
  version: 0.11.0
  description: >-
    Phase 2E contract. Operational endpoints, tenant-aware discovery, identity,
    customer-owned addresses, authoritative delivery quotes, and atomic
    capacity-backed Quote-to-Order conversion, and the internal payment and
    double-entry ledger foundation are implemented. Payment execution remains
    internal; the versioned tenant chart of accounts and governed account state
    foundation are implemented. The tenant-scoped, SPI-versioned payment-provider abstraction,
    opaque credential-reference, payment-attempt, and callback replay foundation
    are implemented without a real gateway adapter. A customer may open the payment for an
    order they own and read it back, and nothing more: no public endpoint lets a client name
    a payment amount or assert a payment state, and no ledger-governance write endpoint is
    exposed at all. The authenticated initialization orchestrator is implemented as an
    injectable, fail-closed boundary. Gateway callbacks are recorded and then settled by
    server-to-server verification: a payment is captured, posted to the double-entry ledger,
    and marked paid on its order only when the gateway confirms it for the exact expected
    amount. No settlement surface is exposed publicly — the customer's return carries an
    opaque reference and no verdict. Authentication delivery
    now has tenant-scoped persistence, abuse controls, a versioned provider SPI, and recoverable
    two-transaction orchestration; no Iranian SMS provider is approved or enabled.
    Payment gateway and authentication-delivery provider governance is exposed to staff
    holding a GLOBAL governance grant. Those routes carry opaque credential references
    only: no secret material is ever accepted, stored, or returned by this API.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness independent of external services.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReadiness
      summary: Traffic readiness including required dependencies.
      responses:
        '200':
          description: Required dependencies are available.
        '503':
          description: At least one required dependency is unavailable.
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: List active and currently available bakery offerings.
      parameters:
        - in: query
          name: cityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: operationalZoneId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active catalog offerings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid query parameters.
        '503':
          description: Catalog persistence is unavailable.
  /api/v1/serviceability/cities:
    get:
      operationId: listActiveServiceCities
      summary: List active cities with at least one active service area.
      responses:
        '200':
          description: Public cities currently eligible for service discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveCitiesEnvelope' }
        '503':
          description: City persistence is unavailable.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a generic mobile verification challenge.
      description: >-
        Responses never disclose whether the mobile number already belongs to
        an account or whether a phone-specific abuse policy suppressed delivery.
        Delivery depends on an approved provider configuration and production adapter.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for safe replay of the same tenant and mobile request.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: >-
            Generic acceptance. Delivery may be suppressed by a private abuse decision;
            the response does not expose account or throttling state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestEnvelope' }
        '400':
          description: Invalid E.164 mobile number.
        '409':
          description: Idempotency key was reused with a different canonical request.
        '503':
          description: Verification delivery is unavailable.
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Consume a verification challenge and create a server-side session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: >-
            Verification succeeded. A hashed server-side session is issued by
            HttpOnly cookie; no token is returned in the response body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400':
          description: Malformed challenge or code.
        '401':
          description: Challenge is invalid, expired, consumed, or over-attempted.
        '503':
          description: Verification persistence is temporarily unavailable.
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Inspect the current authenticated and authorized session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session and active scoped grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401':
          description: Session is missing, expired, revoked, or unauthorized.
    delete:
      operationId: revokeCurrentSession
      summary: Revoke the current server-side session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Session is revoked or was already absent.
  /api/v1/cart:
    get:
      operationId: getActiveCart
      summary: Read the authenticated customer's active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active cart, or null when no active cart exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
  /api/v1/addresses:
    get:
      operationId: listCustomerAddresses
      summary: List the authenticated customer's active delivery addresses.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Active caller-owned addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesEnvelope' }
        '401': { description: A valid customer session is required. }
    post:
      operationId: createCustomerAddress
      summary: Persist an address with server-derived service-area provenance.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '201':
          description: Address created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressEnvelope' }
        '409': { description: Idempotency key payload conflict. }
        '422': { description: Coordinates are unserviceable or ambiguous. }
  /api/v1/cart/items/{offeringId}:
    parameters:
      - in: path
        name: offeringId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCartItem
      summary: Add or replace a server cart item quantity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemMutation' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '400':
          description: Invalid command.
        '401':
          description: A valid customer session is required.
        '409':
          description: Expected cart version is stale.
        '422':
          description: Offering, fulfillment context, or capacity is unavailable.
    delete:
      operationId: removeCartItem
      summary: Remove one offering from the active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRemoval' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Cart or item was not found.
        '409':
          description: Expected cart version is stale.
  /api/v1/cart/quote:
    post:
      operationId: createCartQuote
      summary: Create an immutable, expiring quote from the active cart.
      description: >-
        Reprices every offering, resolves delivery policy on the server, and
        snapshots address and pricing provenance. It does not reserve capacity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteCreate' }
      responses:
        '201':
          description: Quote created or returned from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Active cart was not found.
        '409':
          description: Cart version or idempotency key conflict.
        '422':
          description: Cart, address, pricing, or capacity is not quoteable.
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: The caller's own recent orders, newest first.
      description: >-
        Drafts are excluded — a draft is an order the customer never placed, and showing
        abandoned checkouts back as orders would confuse more than it informs. Bounded
        rather than paginated: a customer following their bread is looking at the last
        few, not browsing a history.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Recent orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListEnvelope' }
        '401': { description: A valid customer session is required. }
        '503': { description: Orders are temporarily unavailable. }
    post:
      operationId: createOrderFromQuote
      summary: Atomically accept a quote and reserve bakery capacity.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Capacity-backed order created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { description: Quote is not available to the caller. }
        '409': { description: Quote or idempotency/concurrency conflict. }
        '422': { description: Snapshot, pricing, branch, or capacity is unavailable. }
  /api/v1/orders/{orderId}:
    get:
      operationId: readOrder
      summary: Follow one of your own orders.
      description: >-
        Scoped to the session's own customer, so another customer's order reads as absent
        rather than as a refusal that confirms it exists. This is where a paid order stops
        being a void: before it existed, a customer paid and had no way to learn anything
        ever happened.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '401': { description: A valid customer session is required. }
        '404': { description: No such order for this customer. }
        '503': { description: Orders are temporarily unavailable. }
  /api/v1/payments:
    post:
      operationId: startPayment
      summary: Open the payment for an order the caller owns.
      description: >-
        The amount is never sent — it comes from the order's own total, because a
        client-supplied amount would be a client-chosen price. The payment is opened in
        CREATED and stays there: settlement walks it to PENDING, AUTHORIZED and captured
        when the gateway confirms, and letting a customer request any of those would be
        letting them assert they had paid. Replaying the same idempotency key returns the
        same payment rather than opening a second.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCheckoutStart' }
      responses:
        '201':
          description: The opened payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
        '400': { description: The request is malformed. }
        '401': { description: A valid customer session is required. }
        '404': { description: No such order for this customer. }
        '409': { description: This order already has a payment. }
        '422': { description: The order cannot be paid in its current state. }
        '503': { description: Payments are temporarily unavailable. }
  /api/v1/payments/{paymentId}:
    get:
      operationId: readPayment
      summary: Read a payment back, after returning from the gateway.
      description: >-
        The screen a gateway returns to needs this. The return redirect proves nothing on
        its own — every parameter on it is attacker-controllable, and the verdict comes
        from the gateway's own server-to-server answer — so the app asks what actually
        happened rather than believing the URL it landed on. Settlement may not have
        finished when the customer returns, so a state short of CAPTURED is a reason to
        ask again, not a failure.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
        '401': { description: A valid customer session is required. }
        '404': { description: No such payment for this customer. }
        '503': { description: Payments are temporarily unavailable. }
  /api/v1/payments/initialize:
    post:
      operationId: initializePaymentExecution
      summary: Prepare and invoke a configured payment provider initialization boundary.
      description: >-
        The authenticated caller supplies only a payment ID and idempotency key. Tenant,
        customer, order, amount, currency, provider configuration, adapter version, and
        credential reference are resolved server-side. The endpoint never captures payment,
        posts a ledger transaction, marks an order paid, or performs browser navigation.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentExecutionInitialize' }
      responses:
        '200':
          description: Historical execution result returned from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentExecutionEnvelope' }
        '201':
          description: Initialization attempt persisted with a normalized safe result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentExecutionEnvelope' }
        '400': { description: The execution command is malformed. }
        '401': { description: A valid customer session is required. }
        '404': { description: Payment is unavailable to the caller. }
        '409': { description: Idempotency, provider reference, or concurrency conflict. }
        '422': { description: Payment is not eligible for provider initialization. }
        '503':
          { description: Provider, adapter, credential, or persistence boundary is unavailable. }
  /api/v1/admin/payment-providers/credentials:
    post:
      operationId: createAdminPaymentProviderCredential
      summary: Register an opaque credential reference for a payment gateway.
      description: >-
        Accepts only a reference into the deployment's secret store. The secret value
        itself never travels through this API, is never persisted by it, and can never
        be read back through it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProviderCredentialCreate' }
      responses:
        '201':
          description: Credential reference registered or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProviderCredentialEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409': { description: Idempotency or concurrency conflict. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations:
    get:
      operationId: listAdminPaymentProviderConfigurations
      summary: List the tenant's payment gateway configurations.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Configurations, newest first, without any credential material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '503': { description: Provider governance persistence is unavailable. }
    post:
      operationId: createAdminPaymentProviderConfiguration
      summary: Create a payment gateway configuration bound to a credential reference.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationCreate' }
      responses:
        '201':
          description: Configuration created or replayed idempotently, inactive and UNKNOWN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409': { description: Idempotency or concurrency conflict. }
        '422': { description: No adapter serves the requested provider, version, or capabilities. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations/{configurationId}/governance:
    post:
      operationId: governAdminPaymentProviderConfiguration
      summary: Activate, deactivate, or make default a payment gateway configuration.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderGovernance' }
      responses:
        '200':
          description: Governance applied or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '409': { description: Idempotency or concurrency conflict. }
        '422': { description: No adapter serves this configuration. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations/{configurationId}/health:
    post:
      operationId: setAdminPaymentProviderHealth
      summary: Attest or withdraw a payment gateway's health.
      description: >-
        Selection only ever picks a HEALTHY configuration, so this is what makes a newly
        created gateway usable, and what removes it from rotation during an incident.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderHealth' }
      responses:
        '200':
          description: Health recorded with an audited reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/sms-providers/configurations:
    get:
      operationId: listAdminAuthDeliveryConfigurations
      summary: List the tenant's authentication SMS provider configurations.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Configurations without any credential material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '503': { description: Provider governance persistence is unavailable. }
    post:
      operationId: createAdminAuthDeliveryConfiguration
      summary: Configure the SMS provider that delivers authentication codes.
      description: >-
        A configuration is frozen by the database after insert, so it is created in its
        final governed shape. Health is the only field that can change afterwards.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationCreate' }
      responses:
        '201':
          description: Configuration created, or returned unchanged when identical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409':
          description: >-
            An immutable configuration differs from the request, an enabled default
            already exists, or a concurrency conflict occurred.
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/sms-providers/configurations/{configurationId}/health:
    post:
      operationId: setAdminAuthDeliveryHealth
      summary: Take an SMS provider out of, or back into, rotation.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAuthDeliveryHealth' }
      responses:
        '200':
          description: Health recorded with an audited reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/reports/sales:
    get:
      operationId: getAdminSalesReport
      summary: Sales and order aggregates for a period.
      description: >-
        Amounts are IRR minor units as decimal strings; an order total routinely exceeds
        what a JSON number holds exactly. The range is closed-open, so consecutive periods
        tile without counting the boundary twice. Draft orders are excluded everywhere:
        a draft is an order the customer never placed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Aggregates for the requested period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReportEnvelope' }
        '400': { description: The reporting range is malformed or inverted. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not read reports. }
        '422': { description: The reporting range covers too long a period. }
        '503': { description: Reporting is temporarily unavailable. }
  /api/v1/admin/reports/financial:
    get:
      operationId: getAdminFinancialReport
      summary: Trial balance, settlement reconciliation, and gateway funnel.
      description: >-
        Three questions answered separately because they fail separately: whether the
        ledger balances, whether the money customers paid actually arrived, and which
        gateway is failing. The trial balance is cumulative as of the range's end rather
        than confined to it — a balance for one week in isolation omits everything carried
        in — while settlement and funnel figures cover the range itself. Paid orders are
        dated by the capture that paid them, not by the order's own `updatedAt`, which is
        auto-managed and would move an order into whatever period it was last edited in.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The financial position and settlement state for the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReportEnvelope' }
        '400': { description: The reporting range is malformed or inverted. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not read reports. }
        '422': { description: The reporting range covers too long a period. }
        '503': { description: Reporting is temporarily unavailable. }
  /api/v1/admin/orders:
    get:
      operationId: listAdminOrders
      summary: Browse the tenant's placed orders.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/OrderState' }
        - name: paymentState
          in: query
          schema: { $ref: '#/components/schemas/PaymentState' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: search
          in: query
          description: >-
            Exact match against an order's public id or the recipient's mobile. Deliberately
            not a prefix or substring search, which would let an operator enumerate
            customers one digit at a time.
          schema: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '200':
          description: Paginated orders, newest first, excluding drafts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderPage' }
        '400': { description: The order query is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not read orders. }
        '503': { description: Reporting is temporarily unavailable. }
  /api/v1/admin/orders/{orderId}:
    get:
      operationId: getAdminOrder
      summary: Inspect one order, with items and its state history.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderDetailEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not read orders. }
        '404': { description: No such order in this tenant. }
        '503': { description: Reporting is temporarily unavailable. }
  /api/v1/admin/orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      summary: Accept a paid order into the bakery.
      description: >-
        Refused unless the order is paid. Accepting commits a bakery to bake bread, and
        doing that before the money arrived is the mistake this rule exists to prevent.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderTransitionCommand' }
      responses:
        '200':
          description: The order after the step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOperationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not operate orders. }
        '404': { description: No such order in this tenant. }
        '409': { description: The order is unpaid, or the step is unavailable from its state. }
        '503': { description: Order operations are unavailable. }
  /api/v1/admin/orders/{orderId}/reject:
    post:
      operationId: rejectOrder
      summary: Refuse an order the bakery cannot take.
      description: >-
        Does not require the order to be paid — the unpaid case is exactly the one that
        needs rejecting.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderTransitionCommand' }
      responses:
        '200':
          description: The cancelled order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOperationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not operate orders. }
        '404': { description: No such order in this tenant. }
        '409': { description: The step is unavailable from the order current state. }
        '503': { description: Order operations are unavailable. }
  /api/v1/admin/orders/{orderId}/start-fulfillment:
    post:
      operationId: startOrderFulfillment
      summary: Move an accepted order into fulfillment.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderTransitionCommand' }
      responses:
        '200':
          description: The order after the step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOperationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not operate orders. }
        '404': { description: No such order in this tenant. }
        '409': { description: The order is unpaid, or the step is unavailable. }
        '503': { description: Order operations are unavailable. }
  /api/v1/admin/orders/{orderId}/complete:
    post:
      operationId: completeOrder
      summary: Close a delivered order.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderTransitionCommand' }
      responses:
        '200':
          description: The completed order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOperationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not operate orders. }
        '404': { description: No such order in this tenant. }
        '409': { description: The order is unpaid, or the step is unavailable. }
        '503': { description: Order operations are unavailable. }
  /api/v1/admin/orders/{orderId}/production:
    post:
      operationId: advanceOrderProduction
      summary: Move the bread through the bakery.
      description: >-
        Production is tracked separately from the order because they answer different
        questions and move at different speeds: an order is confirmed the moment the
        bakery accepts it, but the bread is not scheduled, baking, or ready until it is.
        Production only moves while the order is live, and only forwards — except
        SCHEDULED back to UNSCHEDULED, which is a bakery releasing a slot it cannot fill.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionTransitionCommand' }
      responses:
        '200':
          description: The order after the production step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOperationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not operate orders. }
        '404': { description: No such order in this tenant. }
        '409': { description: Production does not apply, or the step is not a legal one. }
        '503': { description: Order operations are unavailable. }
  /api/v1/admin/catalog/categories:
    get:
      operationId: listAdminCatalogCategories
      summary: Product categories, with how many products each holds.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Every category in the tenant, by code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCategoryListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '503': { description: The catalogue is temporarily unavailable. }
    post:
      operationId: createAdminCatalogCategory
      summary: Create a product category.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogCategoryCommand' }
      responses:
        '201':
          description: The category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCategoryEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '409': { description: A category already uses that code. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/products:
    get:
      operationId: listAdminCatalogProducts
      summary: Browse products with their variants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: lifecycle
          in: query
          schema: { $ref: '#/components/schemas/ProductLifecycle' }
        - name: search
          in: query
          description: Case-insensitive match on the Persian name or the slug.
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Paginated products, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductPage' }
        '400': { description: The product query is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '503': { description: The catalogue is temporarily unavailable. }
    post:
      operationId: createAdminCatalogProduct
      summary: Create a product. It always starts as a draft.
      description: >-
        A product describes what the bread is. Pricing belongs to an offering, which is a
        branch's decision to sell one of this product's variants. A new product is a draft
        because a product that went live the moment it was named would be sellable before
        anyone priced it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductCommand' }
      responses:
        '201':
          description: The draft product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such category in this tenant. }
        '409': { description: A product already uses that slug. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/products/{productId}:
    get:
      operationId: getAdminCatalogProduct
      summary: One product with all of its variants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such product in this tenant. }
        '503': { description: The catalogue is temporarily unavailable. }
    patch:
      operationId: updateAdminCatalogProduct
      summary: Rename, re-describe, or move a product's lifecycle.
      description: >-
        RETIRED is terminal. Bringing a retired product back would resurrect a name that
        order snapshots and customers' history already treat as finished; if the bakery
        sells it again, it is a new product. Retiring one is refused while any branch is
        still selling its variants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductCommand' }
      responses:
        '200':
          description: The updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductEnvelope' }
        '400': { description: The command is malformed or changes nothing. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such product in this tenant. }
        '409': { description: The lifecycle change is not allowed, or offerings are still live. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/products/{productId}/variants:
    post:
      operationId: createAdminCatalogVariant
      summary: Add a variant to a product.
      description: >-
        Classification fields are required together and validated as a set: a freshness
        claim is only meaningful against a fulfillment class, and a packaged class without
        packaging is not a half-filled form but an invalid product. The same rule refuses
        the combination here that would refuse it at checkout.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVariantCommand' }
      responses:
        '201':
          description: The draft variant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVariantEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such product in this tenant. }
        '409': { description: A variant already uses that SKU, or the product is retired. }
        '422': { description: The classification is not a valid combination. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/variants/{variantId}:
    patch:
      operationId: updateAdminCatalogVariant
      summary: Rename a variant, revise its ingredients, or move its lifecycle.
      description: >-
        Classification is not patchable. Those fields decide how the order pipeline
        schedules, holds, and hands over the item; changing them under live offerings
        would silently re-plan work already committed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVariantCommand' }
      responses:
        '200':
          description: The updated variant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVariantEnvelope' }
        '400': { description: The command is malformed or changes nothing. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such variant in this tenant. }
        '409': { description: The lifecycle change is not allowed, or offerings are still live. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/branches:
    get:
      operationId: listAdminCatalogBranches
      summary: Branches that can carry offerings.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Every branch in the tenant, with how many offerings it carries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBranchListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/offerings:
    get:
      operationId: listAdminCatalogOfferings
      summary: Browse what each branch sells, and at what price.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: bakeryBranchId
          in: query
          schema: { type: string, format: uuid }
        - name: productVariantId
          in: query
          schema: { type: string, format: uuid }
        - name: availability
          in: query
          schema: { $ref: '#/components/schemas/OfferingAvailability' }
      responses:
        '200':
          description: Paginated offerings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOfferingPage' }
        '400': { description: The offering query is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '503': { description: The catalogue is temporarily unavailable. }
    post:
      operationId: createAdminCatalogOffering
      summary: Offer a variant at a branch, at a price.
      description: >-
        One offering per branch per variant: a second would give the same bread two prices
        at the same counter, and the selector has no rule for choosing between them. A new
        offering starts as a draft — price, capacity, and preparation time all deserve a
        second look before customers see it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfferingCommand' }
      responses:
        '201':
          description: The draft offering.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOfferingEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such branch or variant in this tenant. }
        '409': { description: This branch already offers that variant, or the variant is retired. }
        '422': { description: Stock on hand must be set exactly when stock is tracked. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/catalog/offerings/{offeringId}:
    patch:
      operationId: updateAdminCatalogOffering
      summary: Reprice an offering, pause it, or adjust its stock.
      description: >-
        Price and availability are one command on purpose: an operator correcting a
        mispriced offering usually pauses it in the same breath, and splitting the two
        would leave a window where the wrong price is live. Repricing never rewrites an
        order — order lines carry their own price snapshot taken when the quote was
        accepted. The previous price is recorded on the audit trail, because reconciling a
        customer's complaint months later means knowing what the price was at the time.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOfferingCommand' }
      responses:
        '200':
          description: The updated offering.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOfferingEnvelope' }
        '400': { description: The command is malformed or changes nothing. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage the catalogue. }
        '404': { description: No such offering in this tenant. }
        '409': { description: The variant or product is not active, or the offering is retired. }
        '422': { description: Stock on hand must be set exactly when stock is tracked. }
        '503': { description: The catalogue is temporarily unavailable. }
  /api/v1/admin/access/roles:
    get:
      operationId: listAdminAccessRoles
      summary: The role catalogue, marked with what this caller may grant.
      description: >-
        `grantable` is false when the role carries a permission the caller does not itself
        hold. Roles are still listed, so an operator can see what they would need rather
        than wondering why a role is missing.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Every admin role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage staff access. }
  /api/v1/admin/access/staff:
    get:
      operationId: listAdminStaff
      summary: Accounts in this tenant that hold, or have held, an admin role.
      description: >-
        Deliberately not every tenant member. The tenant's customers are identity accounts
        too, and listing them here would turn an access screen into a customer directory.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Staff accounts with their live grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMemberListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage staff access. }
        '503': { description: Access management is temporarily unavailable. }
  /api/v1/admin/access/grants:
    post:
      operationId: grantAdminRole
      summary: Grant a role to a mobile number.
      description: >-
        Refused when the role carries any permission the caller does not hold, measured
        against live grant rows rather than the caller's session. The target must have
        signed in once with that number — signing in is what creates the account and what
        proves whoever holds the number asked to be here. Re-granting a role someone
        already holds is a no-op, not an error.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRoleCommand' }
      responses:
        '201':
          description: The staff member, with their grants after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMemberEnvelope' }
        '400': { description: The command is malformed, or names an unknown role. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage access, or the role exceeds its own. }
        '404': { description: No account for that number. }
        '409': { description: That account is not active, or not a member of this tenant. }
        '503': { description: Access management is temporarily unavailable. }
  /api/v1/admin/access/revocations:
    post:
      operationId: revokeAdminRole
      summary: Revoke a role grant.
      description: >-
        Measured by the same yardstick as granting: revoking a role the caller could not
        have granted is refused, because otherwise a narrow operator could strip every
        wider one and be left alone in the tenant. An account cannot revoke its own grant —
        recovering from that needs shell access to the database server.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeRoleCommand' }
      responses:
        '200':
          description: The staff member, with their grants after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMemberEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not manage access, or the role exceeds its own. }
        '404': { description: No such grant in this tenant. }
        '409': { description: An account cannot revoke its own access. }
        '503': { description: Access management is temporarily unavailable. }
  /api/v1/serviceability/check:
    post:
      operationId: checkServiceability
      summary: Evaluate a coordinate against active city service polygons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceabilityRequest'
      responses:
        '200':
          description: Serviceability decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityEnvelope'
        '400':
          description: Invalid request.
        '503':
          description: Serviceability persistence is unavailable.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: alo_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp, version]
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        version: { type: string, const: v1 }
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, enum: [IRR] }
    ActiveCitySummary:
      type: object
      required: [id, code, nameFa, timezone]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        nameFa: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
    ActiveCitiesEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ActiveCitySummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpRequest:
      type: object
      additionalProperties: false
      required: [mobileE164]
      properties:
        mobileE164:
          type: string
          pattern: '^\+989\d{9}$'
    OtpRequestAccepted:
      type: object
      required: [challengeId, expiresAt, retryAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        retryAfterSeconds: { type: integer, minimum: 0 }
    OtpRequestEnvelope:
      type: object
      required: [success, data, meta]
      properties:
