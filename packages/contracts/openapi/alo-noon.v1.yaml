openapi: 3.1.0
info:
  title: Alo Noon API
  version: 0.3.0
  description: >-
    Phase 2B contract. Operational endpoints, read-only discovery,
    serviceability, OTP identity verification, revocable sessions, and scoped
    authorization foundations are implemented.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness independent of external services.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReadiness
      summary: Traffic readiness including required dependencies.
      responses:
        '200':
          description: Required dependencies are available.
        '503':
          description: At least one required dependency is unavailable.
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: List active and currently available bakery offerings.
      parameters:
        - in: query
          name: cityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: operationalZoneId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active catalog offerings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid query parameters.
        '503':
          description: Catalog persistence is unavailable.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a generic mobile verification challenge.
      description: >-
        Responses never disclose whether the mobile number already belongs to
        an account. Delivery depends on an approved provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Challenge accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestEnvelope' }
        '400':
          description: Invalid E.164 mobile number.
        '429':
          description: Cooldown or bounded request limit is active.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        '503':
          description: Verification delivery is unavailable.
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Consume a verification challenge and create a server-side session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: >-
            Verification succeeded. A hashed server-side session is issued by
            HttpOnly cookie; no token is returned in the response body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400':
          description: Malformed challenge or code.
        '401':
          description: Challenge is invalid, expired, consumed, or over-attempted.
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Inspect the current authenticated and authorized session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session and active scoped grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401':
          description: Session is missing, expired, revoked, or unauthorized.
    delete:
      operationId: revokeCurrentSession
      summary: Revoke the current server-side session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Session is revoked or was already absent.
  /api/v1/serviceability/check:
    post:
      operationId: checkServiceability
      summary: Evaluate a coordinate against active city service polygons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceabilityRequest'
      responses:
        '200':
          description: Serviceability decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityEnvelope'
        '400':
          description: Invalid request.
        '503':
          description: Serviceability persistence is unavailable.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: alo_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp, version]
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        version: { type: string, const: v1 }
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, enum: [IRR] }
    OtpRequest:
      type: object
      required: [mobileE164]
      properties:
        mobileE164:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
    OtpRequestAccepted:
      type: object
      required: [challengeId, expiresAt, retryAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        retryAfterSeconds: { type: integer, minimum: 0 }
    OtpRequestEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OtpRequestAccepted' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$' }
    AccessGrant:
      type: object
      required: [roleCode, permissions, scopeType, scopeId, expiresAt]
      properties:
        roleCode: { type: string }
        permissions:
          type: array
          items: { type: string }
        scopeType:
          type: string
          enum: [GLOBAL, CITY, OPERATIONAL_ZONE, BAKERY_BRANCH, COURIER_PARTNER, SELF]
        scopeId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: [string, 'null']
          format: date-time
    SessionContext:
      type: object
      required: [accountId, customerId, expiresAt, grants]
      properties:
        accountId: { type: string, format: uuid }
        customerId:
          type: [string, 'null']
          format: uuid
        expiresAt: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: '#/components/schemas/AccessGrant' }
    SessionEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/SessionContext' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ProductSummary:
      type: object
      required: [id, variantId, sku, nameFa, fulfillmentClass, freshnessClaim, price, lifecycle]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        nameFa: { type: string }
        fulfillmentClass:
          type: string
          enum:
            [
              SIGNATURE_FRESH,
              PACKAGED_TRADITIONAL,
              PACKAGED_FANTASY,
              PACKAGED_DIETARY,
              LIMITED_EDITION,
            ]
        freshnessClaim:
          type: string
          enum: [FRESHLY_PRODUCED, PACKAGED, SHELF_STABLE, NONE]
        price: { $ref: '#/components/schemas/Money' }
        bakeryBranchId: { type: string, format: uuid }
        mediaRef: { type: string }
        lifecycle: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
    CatalogPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [pagination]
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    ServiceabilityRequest:
      type: object
      required: [cityId, latitude, longitude]
      properties:
        cityId: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        requestedAt: { type: string, format: date-time }
    ServiceabilityDecision:
      type: object
      required: [serviceable, evaluatedAt]
      properties:
        serviceable: { type: boolean }
        operationalZoneId: { type: string, format: uuid }
        serviceAreaId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OUTSIDE_CITY, OUTSIDE_SERVICE_AREA, ZONE_SUSPENDED]
        evaluatedAt: { type: string, format: date-time }
    ServiceabilityEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ServiceabilityDecision' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [status, uptime, version, checks]
          properties:
            status: { type: string, enum: [healthy, degraded, unhealthy] }
            uptime: { type: number, minimum: 0 }
            version: { type: string }
            checks: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
