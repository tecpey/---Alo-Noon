          type: array
          items: { $ref: '#/components/schemas/AdminProduct' }
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - type: object
              required: [pagination]
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    AdminBranch:
      type: object
