openapi: 3.1.0
info:
  title: Alo Noon API
  version: 0.9.0
  description: >-
    Phase 2E contract. Operational endpoints, tenant-aware discovery, identity,
    customer-owned addresses, authoritative delivery quotes, and atomic
    capacity-backed Quote-to-Order conversion, and the internal payment and
    double-entry ledger foundation are implemented. Payment execution remains
    internal; the versioned tenant chart of accounts and governed account state
    foundation are implemented. The tenant-scoped, SPI-versioned payment-provider abstraction,
    opaque credential-reference, payment-attempt, and callback replay foundation
    are implemented without a real gateway adapter. No public payment-status or ledger-governance
    write endpoint is exposed, and no provider-governance or provider-execution endpoint exists.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness independent of external services.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReadiness
      summary: Traffic readiness including required dependencies.
      responses:
        '200':
          description: Required dependencies are available.
        '503':
          description: At least one required dependency is unavailable.
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: List active and currently available bakery offerings.
      parameters:
        - in: query
          name: cityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: operationalZoneId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active catalog offerings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid query parameters.
        '503':
          description: Catalog persistence is unavailable.
  /api/v1/serviceability/cities:
    get:
      operationId: listActiveServiceCities
      summary: List active cities with at least one active service area.
      responses:
        '200':
          description: Public cities currently eligible for service discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveCitiesEnvelope' }
        '503':
          description: City persistence is unavailable.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a generic mobile verification challenge.
      description: >-
        Responses never disclose whether the mobile number already belongs to
        an account. Delivery depends on an approved provider configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Challenge accepted for delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestEnvelope' }
        '400':
          description: Invalid E.164 mobile number.
        '429':
          description: Cooldown or bounded request limit is active.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        '503':
          description: Verification delivery is unavailable.
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Consume a verification challenge and create a server-side session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: >-
            Verification succeeded. A hashed server-side session is issued by
            HttpOnly cookie; no token is returned in the response body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400':
          description: Malformed challenge or code.
        '401':
          description: Challenge is invalid, expired, consumed, or over-attempted.
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Inspect the current authenticated and authorized session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session and active scoped grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401':
          description: Session is missing, expired, revoked, or unauthorized.
    delete:
      operationId: revokeCurrentSession
      summary: Revoke the current server-side session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Session is revoked or was already absent.
  /api/v1/cart:
    get:
      operationId: getActiveCart
      summary: Read the authenticated customer's active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active cart, or null when no active cart exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
  /api/v1/addresses:
    get:
      operationId: listCustomerAddresses
      summary: List the authenticated customer's active delivery addresses.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Active caller-owned addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesEnvelope' }
        '401': { description: A valid customer session is required. }
    post:
      operationId: createCustomerAddress
      summary: Persist an address with server-derived service-area provenance.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '201':
          description: Address created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressEnvelope' }
        '409': { description: Idempotency key payload conflict. }
        '422': { description: Coordinates are unserviceable or ambiguous. }
  /api/v1/cart/items/{offeringId}:
    parameters:
      - in: path
        name: offeringId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCartItem
      summary: Add or replace a server cart item quantity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemMutation' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '400':
          description: Invalid command.
        '401':
          description: A valid customer session is required.
        '409':
          description: Expected cart version is stale.
        '422':
          description: Offering, fulfillment context, or capacity is unavailable.
    delete:
      operationId: removeCartItem
      summary: Remove one offering from the active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRemoval' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Cart or item was not found.
        '409':
          description: Expected cart version is stale.
  /api/v1/cart/quote:
    post:
      operationId: createCartQuote
      summary: Create an immutable, expiring quote from the active cart.
      description: >-
        Reprices every offering, resolves delivery policy on the server, and
        snapshots address and pricing provenance. It does not reserve capacity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteCreate' }
      responses:
        '201':
          description: Quote created or returned from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Active cart was not found.
        '409':
          description: Cart version or idempotency key conflict.
        '422':
          description: Cart, address, pricing, or capacity is not quoteable.
  /api/v1/orders:
    post:
      operationId: createOrderFromQuote
      summary: Atomically accept a quote and reserve bakery capacity.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Capacity-backed order created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { description: Quote is not available to the caller. }
        '409': { description: Quote or idempotency/concurrency conflict. }
        '422': { description: Snapshot, pricing, branch, or capacity is unavailable. }
  /api/v1/serviceability/check:
    post:
      operationId: checkServiceability
      summary: Evaluate a coordinate against active city service polygons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceabilityRequest'
      responses:
        '200':
          description: Serviceability decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityEnvelope'
        '400':
          description: Invalid request.
        '503':
          description: Serviceability persistence is unavailable.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: alo_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp, version]
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        version: { type: string, const: v1 }
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, enum: [IRR] }
    ActiveCitySummary:
      type: object
      required: [id, code, nameFa, timezone]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        nameFa: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
    ActiveCitiesEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ActiveCitySummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpRequest:
      type: object
      required: [mobileE164]
      properties:
        mobileE164:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
    OtpRequestAccepted:
      type: object
      required: [challengeId, expiresAt, retryAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        retryAfterSeconds: { type: integer, minimum: 0 }
    OtpRequestEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OtpRequestAccepted' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$' }
    AccessGrant:
      type: object
      required: [roleCode, permissions, scopeType, scopeId, expiresAt]
      properties:
        roleCode: { type: string }
        permissions:
          type: array
          items: { type: string }
        scopeType:
          type: string
          enum: [GLOBAL, CITY, OPERATIONAL_ZONE, BAKERY_BRANCH, COURIER_PARTNER, SELF]
        scopeId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: [string, 'null']
          format: date-time
    SessionContext:
      type: object
      required: [accountId, customerId, expiresAt, grants]
      properties:
        accountId: { type: string, format: uuid }
        customerId:
          type: [string, 'null']
          format: uuid
        expiresAt: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: '#/components/schemas/AccessGrant' }
    SessionEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/SessionContext' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ProductSummary:
      type: object
      required:
        [id, offeringId, variantId, sku, nameFa, fulfillmentClass, freshnessClaim, price, lifecycle]
      properties:
        id: { type: string, format: uuid }
        offeringId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        nameFa: { type: string }
        fulfillmentClass:
          type: string
          enum:
            [
              SIGNATURE_FRESH,
              PACKAGED_TRADITIONAL,
              PACKAGED_FANTASY,
              PACKAGED_DIETARY,
              LIMITED_EDITION,
            ]
        freshnessClaim:
          type: string
          enum: [FRESHLY_PRODUCED, PACKAGED, SHELF_STABLE, NONE]
        price: { $ref: '#/components/schemas/Money' }
        bakeryBranchId: { type: string, format: uuid }
        mediaRef: { type: string }
        lifecycle: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
    CatalogPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [pagination]
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    CartItemMutation:
      type: object
      required: [cityId, operationalZoneId, quantity]
      properties:
        cityId: { type: string, format: uuid }
        operationalZoneId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        expectedCartVersion: { type: integer, minimum: 1 }
    CartItemRemoval:
      type: object
      properties:
        expectedCartVersion: { type: integer, minimum: 1 }
    QuoteCreate:
      type: object
      required: [deliveryAddressId, expectedCartVersion, idempotencyKey]
      properties:
        deliveryAddressId: { type: string, format: uuid }
        expectedCartVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    CommerceItemSnapshot:
      type: object
      required:
        [
          id,
          bakeryProductOfferingId,
          productVariantId,
          bakeryBranchId,
          sku,
          nameFa,
          fulfillmentClass,
          freshnessClaim,
          quantity,
          unitPrice,
          lineTotal,
        ]
      properties:
        id: { type: string, format: uuid }
        bakeryProductOfferingId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        bakeryBranchId: { type: string, format: uuid }
        sku: { type: string }
        nameFa: { type: string }
        fulfillmentClass:
          type: string
          enum:
            [
              SIGNATURE_FRESH,
              PACKAGED_TRADITIONAL,
              PACKAGED_FANTASY,
              PACKAGED_DIETARY,
              LIMITED_EDITION,
            ]
        freshnessClaim:
          type: string
          enum: [FRESHLY_PRODUCED, PACKAGED, SHELF_STABLE, NONE]
        quantity: { type: integer, minimum: 1, maximum: 100 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
    CartSummary:
      type: object
      required: [id, cityId, operationalZoneId, bakeryBranchId, version, subtotal, items, updatedAt]
      properties:
        id: { type: string, format: uuid }
        cityId: { type: string, format: uuid }
        operationalZoneId: { type: string, format: uuid }
        bakeryBranchId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        subtotal: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CommerceItemSnapshot' }
        updatedAt: { type: string, format: date-time }
    CartEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          oneOf:
            - { $ref: '#/components/schemas/CartSummary' }
            - { type: 'null' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    QuoteSummary:
      type: object
      required:
        [
          id,
          publicId,
          cartId,
          cartVersion,
          status,
          expiresAt,
          deliveryAddressId,
          deliveryServiceAreaId,
          deliveryOperationalZoneId,
          deliveryDistanceMeters,
          deliveryPricingRuleId,
          deliveryPricingRuleVersion,
          subtotal,
          deliveryFee,
          discount,
          total,
          items,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string }
        cartId: { type: string, format: uuid }
        cartVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, SUPERSEDED, EXPIRED, ACCEPTED] }
        expiresAt: { type: string, format: date-time }
        deliveryAddressId: { type: string, format: uuid }
        deliveryServiceAreaId: { type: string, format: uuid }
        deliveryOperationalZoneId: { type: string, format: uuid }
        deliveryDistanceMeters: { type: integer, minimum: 0 }
        deliveryPricingRuleId: { type: string, format: uuid }
        deliveryPricingRuleVersion: { type: integer, minimum: 1 }
        subtotal: { $ref: '#/components/schemas/Money' }
        deliveryFee: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CommerceItemSnapshot' }
        createdAt: { type: string, format: date-time }
    QuoteEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/QuoteSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AddressCreate:
      type: object
      additionalProperties: false
      required:
        [
          cityId,
          label,
          recipientName,
          recipientPhone,
          addressLine,
          latitude,
          longitude,
          idempotencyKey,
        ]
      properties:
        cityId: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 80 }
        recipientName: { type: string, minLength: 2, maxLength: 120 }
        recipientPhone: { type: string, pattern: '^\+98\d{10}$' }
        addressLine: { type: string, minLength: 10, maxLength: 500 }
        postalCode: { type: string, pattern: '^\d{10}$' }
        latitude: { type: number, minimum: 35, maximum: 38.5 }
        longitude: { type: number, minimum: 49, maximum: 54.5 }
        deliveryInstructions: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    AddressSummary:
      type: object
      required:
        [
          id,
          cityId,
          serviceAreaId,
          operationalZoneId,
          label,
          recipientName,
          recipientPhone,
          addressLine,
          latitude,
          longitude,
          verificationStatus,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        cityId: { type: string, format: uuid }
        serviceAreaId: { type: string, format: uuid }
        operationalZoneId: { type: string, format: uuid }
        label: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        addressLine: { type: string }
        postalCode: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        deliveryInstructions: { type: string }
        verificationStatus:
          type: string
          enum: [UNVERIFIED, CUSTOMER_CONFIRMED, OPERATIONS_VERIFIED, REJECTED]
        createdAt: { type: string, format: date-time }
    AddressEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AddressSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AddressesEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/AddressSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OrderCreate:
      type: object
      additionalProperties: false
      required: [quoteId, idempotencyKey]
      properties:
        quoteId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    OrderItemSummary:
      type: object
      required:
        [id, skuSnapshot, nameFaSnapshot, fulfillmentClassSnapshot, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        skuSnapshot: { type: string }
        nameFaSnapshot: { type: string }
        fulfillmentClassSnapshot:
          type: string
          enum:
            [
              SIGNATURE_FRESH,
              PACKAGED_TRADITIONAL,
              PACKAGED_FANTASY,
              PACKAGED_DIETARY,
              LIMITED_EDITION,
            ]
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
    OrderSummary:
      type: object
      required:
        [
          id,
          publicId,
          quoteId,
          state,
          paymentState,
          productionState,
          deliveryState,
          subtotal,
          deliveryFee,
          discount,
          total,
          items,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string }
        quoteId: { type: string, format: uuid }
        state: { type: string, enum: [PENDING_CONFIRMATION] }
        paymentState: { type: string, enum: [NOT_STARTED, PENDING, PAID, REFUND_PENDING, REFUNDED] }
        productionState:
          {
            type: string,
            enum: [NOT_REQUIRED, UNSCHEDULED, SCHEDULED, IN_PRODUCTION, READY, HANDED_OFF],
          }
        deliveryState:
          {
            type: string,
            enum:
              [NOT_REQUIRED, UNASSIGNED, ASSIGNED, PICKED_UP, OUT_FOR_DELIVERY, DELIVERED, FAILED],
          }
        subtotal: { $ref: '#/components/schemas/Money' }
        deliveryFee: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OrderSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentAggregateState:
      type: string
      enum: [CREATED, PENDING, AUTHORIZED, CAPTURED, FAILED]
    PaymentProviderCapability:
      type: string
      enum: [PAYMENT_INITIALIZATION, CALLBACK_VERIFICATION, PAYMENT_INQUIRY, CANCELLATION, REFUND]
    PaymentProviderEnvironment:
      type: string
      enum: [TEST, PRODUCTION]
    ProviderHealthStatus:
      type: string
      enum: [UNKNOWN, HEALTHY, DEGRADED, UNHEALTHY]
    PaymentAttemptState:
      type: string
      enum:
        [
          CREATED,
          INITIALIZATION_PENDING,
          INITIALIZED,
          CUSTOMER_ACTION_REQUIRED,
          CALLBACK_RECEIVED,
          VERIFICATION_PENDING,
          VERIFIED,
          REJECTED,
          FAILED,
          EXPIRED,
        ]
    PaymentProviderConfigurationSummary:
      type: object
      required:
        [
          id,
          providerCode,
          adapterVersion,
          adapterSpiVersion,
          merchantReference,
          environment,
          paymentContext,
          currency,
          callbackPolicy,
          capabilities,
          credentialReferenceId,
          isActive,
          isDefault,
          healthStatus,
          governanceVersion,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        providerCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        adapterVersion:
          { type: string, maxLength: 64, pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' }
        adapterSpiVersion: { type: integer, const: 1 }
        merchantReference: { type: string, minLength: 1, maxLength: 128 }
        environment: { $ref: '#/components/schemas/PaymentProviderEnvironment' }
        paymentContext: { type: string, const: CHECKOUT }
        currency: { type: string, const: IRR }
        callbackPolicy: { type: string, const: SIGNED_ONLY }
        capabilities:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/PaymentProviderCapability' }
        credentialReferenceId: { type: string, format: uuid }
        isActive: { type: boolean }
        isDefault: { type: boolean }
        healthStatus: { $ref: '#/components/schemas/ProviderHealthStatus' }
        governanceVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentAttemptSummary:
      type: object
      required:
        [
          id,
          paymentId,
          providerConfigurationId,
          state,
          providerReference,
          version,
          correlationId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        providerConfigurationId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PaymentAttemptState' }
        providerReference: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        version: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentCallbackReceiptSummary:
      type: object
      required:
        [
          id,
          providerConfigurationId,
          paymentAttemptId,
          externalEventId,
          bodyDigest,
          headersFingerprint,
          verificationStatus,
          processingStatus,
          receivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        providerConfigurationId: { type: string, format: uuid }
        paymentAttemptId: { type: [string, 'null'], format: uuid }
        externalEventId: { type: string, minLength: 1, maxLength: 200 }
        bodyDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        headersFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
        processingStatus: { type: string, enum: [RECEIVED, PROCESSED, REJECTED] }
        receivedAt: { type: string, format: date-time }
    PaymentSummary:
      type: object
      required: [id, publicId, orderId, customerId, state, amount, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string, minLength: 8, maxLength: 32 }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PaymentAggregateState' }
        amount: { $ref: '#/components/schemas/Money' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LedgerAccountType:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
    LedgerAccountGovernanceAction:
      type: string
      enum: [PROVISIONED, ACTIVATED, DEACTIVATED]
    LedgerAccountSummary:
      type: object
      required:
        [
          id,
          parentId,
          code,
          name,
          type,
          currency,
          isSystem,
          isPostable,
          isActive,
          systemKey,
          templateVersion,
          governanceVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/LedgerAccountType' }
        currency: { type: string, const: IRR }
        isSystem: { type: boolean }
        isPostable: { type: boolean }
        isActive: { type: boolean }
        systemKey: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        templateVersion: { type: [integer, 'null'], minimum: 1 }
        governanceVersion: { type: integer, minimum: 0 }
    TenantFinancialBootstrapSummary:
      type: object
      required: [id, tenantId, templateVersion, accountCount, correlationId, completedAt, accounts]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        accountCount: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        accounts:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LedgerAccountSummary' }
    LedgerEntrySide:
      type: string
      enum: [DEBIT, CREDIT]
    LedgerEntrySummary:
      type: object
      required: [id, accountId, accountCode, sequence, side, amount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountCode: { type: string, minLength: 1, maxLength: 64 }
        sequence: { type: integer, minimum: 1 }
        side: { $ref: '#/components/schemas/LedgerEntrySide' }
        amount: { $ref: '#/components/schemas/Money' }
    FinancialTransactionSummary:
      type: object
      required: [id, paymentId, orderId, type, amount, correlationId, occurredAt, postedAt, entries]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [PAYMENT_CAPTURE] }
        amount: { $ref: '#/components/schemas/Money' }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
        entries:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/LedgerEntrySummary' }
    PaymentCreatedEventPayload:
      type: object
      required: [paymentId, orderId, customerId, state, amount, currency]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        state: { type: string, const: CREATED }
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, const: IRR }
    PaymentStateChangedEventPayload:
      type: object
      required: [paymentId, orderId, fromState, toState, version]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        fromState: { $ref: '#/components/schemas/PaymentAggregateState' }
        toState: { $ref: '#/components/schemas/PaymentAggregateState' }
        version: { type: integer, minimum: 2 }
    FinancialTransactionPostedEventPayload:
      type: object
      required: [financialTransactionId, paymentId, orderId, type, amount, currency, entryCount]
      properties:
        financialTransactionId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, const: PAYMENT_CAPTURE }
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, const: IRR }
        entryCount: { type: integer, minimum: 2 }
    FinancialChartProvisionedEventPayload:
      type: object
      required: [tenantId, templateVersion, accountCount]
      properties:
        tenantId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        accountCount: { type: integer, minimum: 1 }
    LedgerAccountStateChangedEventPayload:
      type: object
      required: [ledgerAccountId, code, fromActive, toActive, version, reason]
      properties:
        ledgerAccountId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        fromActive: { type: boolean }
        toActive: { type: boolean }
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ServiceabilityRequest:
      type: object
      required: [cityId, latitude, longitude]
      properties:
        cityId: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        requestedAt: { type: string, format: date-time }
    ServiceabilityDecision:
      type: object
      required: [serviceable, evaluatedAt]
      properties:
        serviceable: { type: boolean }
        operationalZoneId: { type: string, format: uuid }
        serviceAreaId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OUTSIDE_CITY, OUTSIDE_SERVICE_AREA, ZONE_SUSPENDED]
        evaluatedAt: { type: string, format: date-time }
    ServiceabilityEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ServiceabilityDecision' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [status, uptime, version, checks]
          properties:
            status: { type: string, enum: [healthy, degraded, unhealthy] }
            uptime: { type: number, minimum: 0 }
            version: { type: string }
            checks: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
