        updatedAt: { type: string, format: date-time }
    CreateProductCommand:
      type: object
      additionalProperties: false
      required: [categoryId, slug, nameFa]
      properties:
        categoryId: { type: string, format: uuid }
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 100
        nameFa: { type: string, minLength: 1, maxLength: 200 }
        descriptionFa: { type: string, maxLength: 2000 }
        mediaRef: { type: string, maxLength: 500 }
    UpdateProductCommand:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        At least one field other than `reason` must be present. A request that changes
        nothing and reports success is how an operator concludes they saved work they
        did not save.
      properties:
        nameFa: { type: string, minLength: 1, maxLength: 200 }
        descriptionFa: { type: [string, 'null'], maxLength: 2000 }
        mediaRef: { type: [string, 'null'], maxLength: 500 }
        lifecycle: { $ref: '#/components/schemas/ProductLifecycle' }
        reason: { type: string, minLength: 3, maxLength: 280 }
    CreateVariantCommand:
      type: object
      additionalProperties: false
      required: [sku, nameFa, fulfillmentClass, freshnessClaim, productionMode, fulfillmentControl]
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
          minLength: 3
          maxLength: 64
        nameFa: { type: string, minLength: 1, maxLength: 200 }
        fulfillmentClass: { $ref: '#/components/schemas/ProductFulfillmentClass' }
        freshnessClaim: { $ref: '#/components/schemas/FreshnessClaim' }
        productionMode: { $ref: '#/components/schemas/ProductionMode' }
        fulfillmentControl: { $ref: '#/components/schemas/FulfillmentControl' }
        packagingType: { $ref: '#/components/schemas/PackagingType' }
        shelfLifeMinutes: { type: integer, minimum: 1, maximum: 525600 }
        productionWindowMinutes: { type: integer, minimum: 1, maximum: 1440 }
        pickupWithinMinutes: { type: integer, minimum: 1, maximum: 1440 }
        freshnessWindowMinutes: { type: integer, minimum: 1, maximum: 1440 }
        ingredients: { type: array, items: { type: string, maxLength: 120 }, maxItems: 100 }
        allergens: { type: array, items: { type: string, maxLength: 120 }, maxItems: 50 }
        dietaryAttributes: { type: array, items: { type: string, maxLength: 80 }, maxItems: 50 }
    UpdateVariantCommand:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nameFa: { type: string, minLength: 1, maxLength: 200 }
        ingredients: { type: array, items: { type: string, maxLength: 120 }, maxItems: 100 }
        allergens: { type: array, items: { type: string, maxLength: 120 }, maxItems: 50 }
        dietaryAttributes: { type: array, items: { type: string, maxLength: 80 }, maxItems: 50 }
        lifecycle: { $ref: '#/components/schemas/ProductLifecycle' }
        reason: { type: string, minLength: 3, maxLength: 280 }
    AdminProductEnvelope:
      type: object
      required: [success, data, meta]
