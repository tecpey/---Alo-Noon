        qualityStatus:
          type: string
          enum: [PENDING_REVIEW, APPROVED, WATCHLIST, SUSPENDED]
        offeringCount: { type: integer, minimum: 0 }
    AdminBranchListEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminBranch' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AdminOffering:
      type: object
      required:
        [
          id,
          bakeryBranchId,
          branchNameFa,
          productVariantId,
          sku,
          productNameFa,
          variantNameFa,
          variantLifecycle,
          price,
          availability,
          dailyCapacity,
          preparationMinutes,
          stockTracked,
          stockOnHand,
          availableFrom,
          availableUntil,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        bakeryBranchId: { type: string, format: uuid }
        branchNameFa: { type: string, maxLength: 200 }
        productVariantId: { type: string, format: uuid }
        sku: { type: string, maxLength: 64 }
        productNameFa: { type: string, maxLength: 200 }
        variantNameFa: { type: string, maxLength: 200 }
        variantLifecycle: { $ref: '#/components/schemas/ProductLifecycle' }
        price: { $ref: '#/components/schemas/Money' }
        availability: { $ref: '#/components/schemas/OfferingAvailability' }
        dailyCapacity: { type: [integer, 'null'], minimum: 1 }
        preparationMinutes: { type: [integer, 'null'], minimum: 1 }
        stockTracked: { type: boolean }
        stockOnHand: { type: [integer, 'null'], minimum: 0 }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateOfferingCommand:
      type: object
      additionalProperties: false
      required: [bakeryBranchId, productVariantId, price, reason]
      properties:
        bakeryBranchId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
        price:
          type: string
          pattern: '^[1-9][0-9]{0,17}$'
          description: >-
            A positive whole number of Rial. Zero is refused rather than treated as free.
        dailyCapacity: { type: integer, minimum: 1, maximum: 100000 }
        preparationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        stockTracked: { type: boolean, default: false }
        stockOnHand:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Required exactly when stockTracked is true, and forbidden otherwise.
        reason: { type: string, minLength: 3, maxLength: 280 }
    UpdateOfferingCommand:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        price: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
        availability: { $ref: '#/components/schemas/OfferingAvailability' }
        dailyCapacity: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        preparationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        stock:
          type: object
          additionalProperties: false
          required: [stockTracked, stockOnHand]
          properties:
            stockTracked: { type: boolean }
            stockOnHand: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 3, maxLength: 280 }
    AdminOfferingEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/AdminOffering' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AdminOfferingPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminOffering' }
        meta:
          allOf:
            - $ref: '#/components/schemas/ResponseMeta'
            - type: object
              required: [pagination]
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    AdminRoleSummary:
      type: object
      required: [code, name, permissions, grantable]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 120 }
        permissions: { type: array, items: { type: string, maxLength: 100 } }
        grantable:
          type: boolean
          description: False when the role carries a permission the caller does not hold.
    StaffMember:
      type: object
      required: [accountId, mobileE164, status, roles, permissions, isSelf]
      properties:
        accountId: { type: string, format: uuid }
        mobileE164: { type: string, maxLength: 16 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        roles:
          type: array
          items:
            type: object
            required: [grantId, code, name, grantedAt, expiresAt]
            properties:
              grantId: { type: string, format: uuid }
              code: { type: string, maxLength: 64 }
              name: { type: string, maxLength: 120 }
              grantedAt: { type: string, format: date-time }
              expiresAt: { type: [string, 'null'], format: date-time }
        permissions:
          type: array
          items: { type: string, maxLength: 100 }
          description: Union of every permission this account's live grants carry.
        isSelf:
          type: boolean
          description: True for the account making the request, which may not revoke itself.
    GrantRoleCommand:
      type: object
      additionalProperties: false
      required: [mobileE164, roleCode, reason]
      properties:
        mobileE164: { type: string, pattern: '^\+989\d{9}$' }
        roleCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
        reason: { type: string, minLength: 3, maxLength: 280 }
    RevokeRoleCommand:
      type: object
      additionalProperties: false
      required: [grantId, reason]
      properties:
        grantId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 280 }
    AdminRoleListEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminRoleSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    StaffMemberEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/StaffMember' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    StaffMemberListEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/StaffMember' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SignedMoney:
      type: object
      required: [amount, currency]
      description: Money that may legitimately be negative — a ledger balance, or a gap.
      properties:
        amount: { type: string, pattern: '^-?\d+$' }
        currency: { type: string, enum: [IRR] }
    TrialBalanceRow:
      type: object
      required: [accountCode, accountName, accountType, debits, credits, balance, entryCount]
      properties:
        accountCode: { type: string, maxLength: 64 }
        accountName: { type: string }
        accountType:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        debits: { $ref: '#/components/schemas/Money' }
        credits: { $ref: '#/components/schemas/Money' }
        balance:
          allOf:
            - $ref: '#/components/schemas/SignedMoney'
            - description: >-
                Signed by what the account type means: assets and expenses are positive
                when debited, everything else when credited.
        entryCount: { type: integer, minimum: 0 }
    TrialBalance:
      type: object
      required: [asOf, rows, totalDebits, totalCredits, balanced]
      properties:
        asOf: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/TrialBalanceRow' }
        totalDebits: { $ref: '#/components/schemas/Money' }
        totalCredits: { $ref: '#/components/schemas/Money' }
        balanced:
          type: boolean
          description: >-
            False means a posting landed with unequal sides, which database constraints
            are meant to make impossible. Surfaced rather than asserted, because an
            operator finding out beats a report that refuses to render.
    SettlementReconciliation:
      type: object
      required:
        [
          capturedValue,
          capturedCount,
          paidOrders,
          paidOrderValue,
          captureToOrderGap,
          paymentsByState,
          receipts,
        ]
      properties:
        capturedValue: { $ref: '#/components/schemas/Money' }
        capturedCount: { type: integer, minimum: 0 }
        paidOrders: { type: integer, minimum: 0 }
        paidOrderValue: { $ref: '#/components/schemas/Money' }
        captureToOrderGap:
          allOf:
            - $ref: '#/components/schemas/SignedMoney'
            - description: >-
                Non-zero means money moved that the order side does not acknowledge.
        paymentsByState:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        receipts:
          type: object
          required: [total, awaitingProcessing, processed, rejected, oldestAwaitingAt]
          properties:
            total: { type: integer, minimum: 0 }
            awaitingProcessing:
              type: integer
              minimum: 0
              description: Received but not yet settled — the recovery sweep's backlog.
            processed: { type: integer, minimum: 0 }
            rejected:
              type: integer
              minimum: 0
              description: >-
                Refused settlement. Each is either an attack or a bug; the reason is on
                the audit trail under payment.callback_settlement_decided.
            oldestAwaitingAt: { type: [string, 'null'], format: date-time }
    ProviderFunnelRow:
      type: object
      required:
        [
          providerCode,
          environment,
          attempts,
          verified,
          rejected,
          failed,
          inFlight,
          verificationRate,
        ]
      properties:
        providerCode: { type: string, maxLength: 64 }
        environment: { type: string, enum: [TEST, PRODUCTION] }
        attempts: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        inFlight:
          type: integer
          minimum: 0
          description: Started but not concluded — still mid-flight, or abandoned.
        verificationRate: { type: [number, 'null'], minimum: 0, maximum: 1 }
    FinancialReport:
      type: object
      required: [range, trialBalance, settlement, providers]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        trialBalance: { $ref: '#/components/schemas/TrialBalance' }
        settlement: { $ref: '#/components/schemas/SettlementReconciliation' }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderFunnelRow' }
    FinancialReportEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/FinancialReport' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OrderTransitionCommand:
      type: object
      additionalProperties: false
      required: [reason]
      description: >-
        The destination is not in the body: each step has its own route, because
        accepting an order and cancelling one are different acts with different
        consequences and should not differ by one enum value in a payload.
      properties:
        reason: { type: string, minLength: 3, maxLength: 280 }
    ProductionTransitionCommand:
      type: object
      additionalProperties: false
      required: [to, reason]
      properties:
        to: { $ref: '#/components/schemas/ProductionState' }
        reason: { type: string, minLength: 3, maxLength: 280 }
    OrderOperationOutcome:
      type: object
      required: [orderId, publicId, state, paymentState, productionState, deliveryState, updatedAt]
      properties:
        orderId: { type: string, format: uuid }
        publicId: { type: string, minLength: 8, maxLength: 32 }
        state: { $ref: '#/components/schemas/OrderState' }
        paymentState: { $ref: '#/components/schemas/PaymentState' }
        productionState: { $ref: '#/components/schemas/ProductionState' }
        deliveryState: { $ref: '#/components/schemas/DeliveryState' }
        updatedAt: { type: string, format: date-time }
    OrderOperationEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OrderOperationOutcome' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OrderListEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentAttemptSummary:
      type: object
      required:
        [
          id,
          paymentId,
          providerConfigurationId,
          state,
          providerReference,
          version,
          correlationId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        providerConfigurationId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PaymentAttemptState' }
        providerReference: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        version: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentInitializationOutcome:
      type: string
      enum:
        [
          ACCEPTED,
          CUSTOMER_ACTION_REQUIRED,
          REJECTED,
          RETRYABLE_FAILURE,
          PERMANENT_FAILURE,
          UNKNOWN,
        ]
    PaymentExecutionInitialize:
      type: object
      additionalProperties: false
      required: [paymentId, idempotencyKey]
      properties:
        paymentId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    PaymentCheckoutStart:
      type: object
      additionalProperties: false
      required: [orderId, idempotencyKey]
      properties:
        orderId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    PaymentEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PaymentSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentExecutionSummary:
      type: object
      required:
        [
          paymentAttemptId,
          paymentId,
          providerConfigurationId,
          providerCode,
          adapterVersion,
          adapterSpiVersion,
          state,
          outcome,
          providerReference,
          customerAction,
          failure,
          correlationId,
          replayed,
          createdAt,
          updatedAt,
        ]
      properties:
        paymentAttemptId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        providerConfigurationId: { type: string, format: uuid }
        providerCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        adapterVersion:
          { type: string, maxLength: 64, pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' }
        adapterSpiVersion: { type: integer, const: 1 }
        state:
          {
            type: string,
            enum: [INITIALIZATION_PENDING, INITIALIZED, CUSTOMER_ACTION_REQUIRED, FAILED],
          }
        outcome:
          oneOf:
            - { $ref: '#/components/schemas/PaymentInitializationOutcome' }
            - { type: 'null' }
        providerReference: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        customerAction:
          oneOf:
            - type: object
              required: [url, expiresAt]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                expiresAt: { type: [string, 'null'], format: date-time }
            - { type: 'null' }
        failure:
          oneOf:
            - type: object
              required: [code, retryable, customerMessageKey]
              properties:
                code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
                retryable: { type: boolean }
                customerMessageKey: { type: [string, 'null'], pattern: '^[a-z][a-z0-9_.-]{1,99}$' }
            - { type: 'null' }
        correlationId: { type: string, format: uuid }
        replayed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentExecutionEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/PaymentExecutionSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentCallbackReceiptSummary:
      type: object
      required:
        [
          id,
          providerConfigurationId,
          paymentAttemptId,
          externalEventId,
          bodyDigest,
          headersFingerprint,
          verificationStatus,
          processingStatus,
          receivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        providerConfigurationId: { type: string, format: uuid }
        paymentAttemptId: { type: [string, 'null'], format: uuid }
        externalEventId: { type: string, minLength: 1, maxLength: 200 }
        bodyDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
        headersFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        verificationStatus: { type: string, enum: [UNVERIFIED, VERIFIED, REJECTED] }
        processingStatus: { type: string, enum: [RECEIVED, PROCESSED, REJECTED] }
        receivedAt: { type: string, format: date-time }
    PaymentSummary:
      type: object
      required: [id, publicId, orderId, customerId, state, amount, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        publicId: { type: string, minLength: 8, maxLength: 32 }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/PaymentAggregateState' }
        amount: { $ref: '#/components/schemas/Money' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LedgerAccountType:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
    LedgerAccountGovernanceAction:
      type: string
      enum: [PROVISIONED, ACTIVATED, DEACTIVATED]
    LedgerAccountSummary:
      type: object
      required:
        [
          id,
          parentId,
          code,
          name,
          type,
          currency,
          isSystem,
          isPostable,
          isActive,
          systemKey,
          templateVersion,
          governanceVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/LedgerAccountType' }
        currency: { type: string, const: IRR }
        isSystem: { type: boolean }
        isPostable: { type: boolean }
        isActive: { type: boolean }
        systemKey: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        templateVersion: { type: [integer, 'null'], minimum: 1 }
        governanceVersion: { type: integer, minimum: 0 }
    TenantFinancialBootstrapSummary:
      type: object
      required: [id, tenantId, templateVersion, accountCount, correlationId, completedAt, accounts]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        accountCount: { type: integer, minimum: 1 }
        correlationId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        accounts:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LedgerAccountSummary' }
    LedgerEntrySide:
      type: string
      enum: [DEBIT, CREDIT]
    LedgerEntrySummary:
      type: object
      required: [id, accountId, accountCode, sequence, side, amount]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountCode: { type: string, minLength: 1, maxLength: 64 }
        sequence: { type: integer, minimum: 1 }
        side: { $ref: '#/components/schemas/LedgerEntrySide' }
        amount: { $ref: '#/components/schemas/Money' }
    FinancialTransactionSummary:
      type: object
      required: [id, paymentId, orderId, type, amount, correlationId, occurredAt, postedAt, entries]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [PAYMENT_CAPTURE] }
        amount: { $ref: '#/components/schemas/Money' }
        correlationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time }
        entries:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/LedgerEntrySummary' }
    PaymentCreatedEventPayload:
      type: object
      required: [paymentId, orderId, customerId, state, amount, currency]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        state: { type: string, const: CREATED }
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, const: IRR }
    PaymentStateChangedEventPayload:
      type: object
      required: [paymentId, orderId, fromState, toState, version]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        fromState: { $ref: '#/components/schemas/PaymentAggregateState' }
        toState: { $ref: '#/components/schemas/PaymentAggregateState' }
        version: { type: integer, minimum: 2 }
    FinancialTransactionPostedEventPayload:
      type: object
      required: [financialTransactionId, paymentId, orderId, type, amount, currency, entryCount]
      properties:
        financialTransactionId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, const: PAYMENT_CAPTURE }
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, const: IRR }
        entryCount: { type: integer, minimum: 2 }
    FinancialChartProvisionedEventPayload:
      type: object
      required: [tenantId, templateVersion, accountCount]
      properties:
        tenantId: { type: string, format: uuid }
        templateVersion: { type: integer, minimum: 1 }
        accountCount: { type: integer, minimum: 1 }
    LedgerAccountStateChangedEventPayload:
      type: object
      required: [ledgerAccountId, code, fromActive, toActive, version, reason]
      properties:
        ledgerAccountId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        fromActive: { type: boolean }
        toActive: { type: boolean }
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ServiceabilityRequest:
      type: object
      required: [cityId, latitude, longitude]
      properties:
        cityId: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        requestedAt: { type: string, format: date-time }
    ServiceabilityDecision:
      type: object
      required: [serviceable, evaluatedAt]
      properties:
        serviceable: { type: boolean }
        operationalZoneId: { type: string, format: uuid }
        serviceAreaId: { type: string, format: uuid }
        reason:
          type: string
          enum: [OUTSIDE_CITY, OUTSIDE_SERVICE_AREA, ZONE_SUSPENDED]
        evaluatedAt: { type: string, format: date-time }
    ServiceabilityEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/ServiceabilityDecision' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [status, uptime, version, checks]
          properties:
            status: { type: string, enum: [healthy, degraded, unhealthy] }
            uptime: { type: number, minimum: 0 }
            version: { type: string }
            checks: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
