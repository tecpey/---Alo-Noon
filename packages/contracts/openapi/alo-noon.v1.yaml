openapi: 3.1.0
info:
  title: Alo Noon API
  version: 0.11.0
  description: >-
    Phase 2E contract. Operational endpoints, tenant-aware discovery, identity,
    customer-owned addresses, authoritative delivery quotes, and atomic
    capacity-backed Quote-to-Order conversion, and the internal payment and
    double-entry ledger foundation are implemented. Payment execution remains
    internal; the versioned tenant chart of accounts and governed account state
    foundation are implemented. The tenant-scoped, SPI-versioned payment-provider abstraction,
    opaque credential-reference, payment-attempt, and callback replay foundation
    are implemented without a real gateway adapter. No public payment-status or ledger-governance
    write endpoint is exposed. The authenticated initialization orchestrator is implemented as an
    injectable, fail-closed boundary; the production server does not configure a real adapter or
    credential resolver, so real payment execution remains unavailable. Authentication delivery
    now has tenant-scoped persistence, abuse controls, a versioned provider SPI, and recoverable
    two-transaction orchestration; no Iranian SMS provider is approved or enabled.
    Payment gateway and authentication-delivery provider governance is exposed to staff
    holding a GLOBAL governance grant. Those routes carry opaque credential references
    only: no secret material is ever accepted, stored, or returned by this API.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness independent of external services.
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReadiness
      summary: Traffic readiness including required dependencies.
      responses:
        '200':
          description: Required dependencies are available.
        '503':
          description: At least one required dependency is unavailable.
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: List active and currently available bakery offerings.
      parameters:
        - in: query
          name: cityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: operationalZoneId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paginated active catalog offerings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          description: Invalid query parameters.
        '503':
          description: Catalog persistence is unavailable.
  /api/v1/serviceability/cities:
    get:
      operationId: listActiveServiceCities
      summary: List active cities with at least one active service area.
      responses:
        '200':
          description: Public cities currently eligible for service discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveCitiesEnvelope' }
        '503':
          description: City persistence is unavailable.
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a generic mobile verification challenge.
      description: >-
        Responses never disclose whether the mobile number already belongs to
        an account or whether a phone-specific abuse policy suppressed delivery.
        Delivery depends on an approved provider configuration and production adapter.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for safe replay of the same tenant and mobile request.
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: >-
            Generic acceptance. Delivery may be suppressed by a private abuse decision;
            the response does not expose account or throttling state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestEnvelope' }
        '400':
          description: Invalid E.164 mobile number.
        '409':
          description: Idempotency key was reused with a different canonical request.
        '503':
          description: Verification delivery is unavailable.
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Consume a verification challenge and create a server-side session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: >-
            Verification succeeded. A hashed server-side session is issued by
            HttpOnly cookie; no token is returned in the response body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400':
          description: Malformed challenge or code.
        '401':
          description: Challenge is invalid, expired, consumed, or over-attempted.
        '503':
          description: Verification persistence is temporarily unavailable.
  /api/v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Inspect the current authenticated and authorized session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current session and active scoped grants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401':
          description: Session is missing, expired, revoked, or unauthorized.
    delete:
      operationId: revokeCurrentSession
      summary: Revoke the current server-side session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '204':
          description: Session is revoked or was already absent.
  /api/v1/cart:
    get:
      operationId: getActiveCart
      summary: Read the authenticated customer's active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Active cart, or null when no active cart exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
  /api/v1/addresses:
    get:
      operationId: listCustomerAddresses
      summary: List the authenticated customer's active delivery addresses.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Active caller-owned addresses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressesEnvelope' }
        '401': { description: A valid customer session is required. }
    post:
      operationId: createCustomerAddress
      summary: Persist an address with server-derived service-area provenance.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '201':
          description: Address created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressEnvelope' }
        '409': { description: Idempotency key payload conflict. }
        '422': { description: Coordinates are unserviceable or ambiguous. }
  /api/v1/cart/items/{offeringId}:
    parameters:
      - in: path
        name: offeringId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCartItem
      summary: Add or replace a server cart item quantity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemMutation' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '400':
          description: Invalid command.
        '401':
          description: A valid customer session is required.
        '409':
          description: Expected cart version is stale.
        '422':
          description: Offering, fulfillment context, or capacity is unavailable.
    delete:
      operationId: removeCartItem
      summary: Remove one offering from the active server cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRemoval' }
      responses:
        '200':
          description: Updated server-calculated cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Cart or item was not found.
        '409':
          description: Expected cart version is stale.
  /api/v1/cart/quote:
    post:
      operationId: createCartQuote
      summary: Create an immutable, expiring quote from the active cart.
      description: >-
        Reprices every offering, resolves delivery policy on the server, and
        snapshots address and pricing provenance. It does not reserve capacity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteCreate' }
      responses:
        '201':
          description: Quote created or returned from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteEnvelope' }
        '401':
          description: A valid customer session is required.
        '404':
          description: Active cart was not found.
        '409':
          description: Cart version or idempotency key conflict.
        '422':
          description: Cart, address, pricing, or capacity is not quoteable.
  /api/v1/orders:
    post:
      operationId: createOrderFromQuote
      summary: Atomically accept a quote and reserve bakery capacity.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Capacity-backed order created or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { description: Quote is not available to the caller. }
        '409': { description: Quote or idempotency/concurrency conflict. }
        '422': { description: Snapshot, pricing, branch, or capacity is unavailable. }
  /api/v1/payments/initialize:
    post:
      operationId: initializePaymentExecution
      summary: Prepare and invoke a configured payment provider initialization boundary.
      description: >-
        The authenticated caller supplies only a payment ID and idempotency key. Tenant,
        customer, order, amount, currency, provider configuration, adapter version, and
        credential reference are resolved server-side. The endpoint never captures payment,
        posts a ledger transaction, marks an order paid, or performs browser navigation.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentExecutionInitialize' }
      responses:
        '200':
          description: Historical execution result returned from an idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentExecutionEnvelope' }
        '201':
          description: Initialization attempt persisted with a normalized safe result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentExecutionEnvelope' }
        '400': { description: The execution command is malformed. }
        '401': { description: A valid customer session is required. }
        '404': { description: Payment is unavailable to the caller. }
        '409': { description: Idempotency, provider reference, or concurrency conflict. }
        '422': { description: Payment is not eligible for provider initialization. }
        '503':
          { description: Provider, adapter, credential, or persistence boundary is unavailable. }
  /api/v1/admin/payment-providers/credentials:
    post:
      operationId: createAdminPaymentProviderCredential
      summary: Register an opaque credential reference for a payment gateway.
      description: >-
        Accepts only a reference into the deployment's secret store. The secret value
        itself never travels through this API, is never persisted by it, and can never
        be read back through it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProviderCredentialCreate' }
      responses:
        '201':
          description: Credential reference registered or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProviderCredentialEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409': { description: Idempotency or concurrency conflict. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations:
    get:
      operationId: listAdminPaymentProviderConfigurations
      summary: List the tenant's payment gateway configurations.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Configurations, newest first, without any credential material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '503': { description: Provider governance persistence is unavailable. }
    post:
      operationId: createAdminPaymentProviderConfiguration
      summary: Create a payment gateway configuration bound to a credential reference.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationCreate' }
      responses:
        '201':
          description: Configuration created or replayed idempotently, inactive and UNKNOWN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409': { description: Idempotency or concurrency conflict. }
        '422': { description: No adapter serves the requested provider, version, or capabilities. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations/{configurationId}/governance:
    post:
      operationId: governAdminPaymentProviderConfiguration
      summary: Activate, deactivate, or make default a payment gateway configuration.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderGovernance' }
      responses:
        '200':
          description: Governance applied or replayed idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '409': { description: Idempotency or concurrency conflict. }
        '422': { description: No adapter serves this configuration. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/payment-providers/configurations/{configurationId}/health:
    post:
      operationId: setAdminPaymentProviderHealth
      summary: Attest or withdraw a payment gateway's health.
      description: >-
        Selection only ever picks a HEALTHY configuration, so this is what makes a newly
        created gateway usable, and what removes it from rotation during an incident.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPaymentProviderHealth' }
      responses:
        '200':
          description: Health recorded with an audited reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentProviderConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/sms-providers/configurations:
    get:
      operationId: listAdminAuthDeliveryConfigurations
      summary: List the tenant's authentication SMS provider configurations.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Configurations without any credential material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationListEnvelope' }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '503': { description: Provider governance persistence is unavailable. }
    post:
      operationId: createAdminAuthDeliveryConfiguration
      summary: Configure the SMS provider that delivers authentication codes.
      description: >-
        A configuration is frozen by the database after insert, so it is created in its
        final governed shape. Health is the only field that can change afterwards.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationCreate' }
      responses:
        '201':
          description: Configuration created, or returned unchanged when identical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '409':
          description: >-
            An immutable configuration differs from the request, an enabled default
            already exists, or a concurrency conflict occurred.
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/admin/sms-providers/configurations/{configurationId}/health:
    post:
      operationId: setAdminAuthDeliveryHealth
      summary: Take an SMS provider out of, or back into, rotation.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAuthDeliveryHealth' }
      responses:
        '200':
          description: Health recorded with an audited reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthDeliveryConfigurationEnvelope' }
        '400': { description: The command is malformed. }
        '401': { description: A valid staff session is required. }
        '403': { description: The account may not govern provider configuration. }
        '404': { description: No such configuration for this tenant. }
        '503': { description: Provider governance persistence is unavailable. }
  /api/v1/serviceability/check:
    post:
      operationId: checkServiceability
      summary: Evaluate a coordinate against active city service polygons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceabilityRequest'
      responses:
        '200':
          description: Serviceability decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityEnvelope'
        '400':
          description: Invalid request.
        '503':
          description: Serviceability persistence is unavailable.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: alo_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp, version]
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        version: { type: string, const: v1 }
    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+$' }
        currency: { type: string, enum: [IRR] }
    ActiveCitySummary:
      type: object
      required: [id, code, nameFa, timezone]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 32 }
        nameFa: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
    ActiveCitiesEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ActiveCitySummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpRequest:
      type: object
      additionalProperties: false
      required: [mobileE164]
      properties:
        mobileE164:
          type: string
          pattern: '^\+989\d{9}$'
    OtpRequestAccepted:
      type: object
      required: [challengeId, expiresAt, retryAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        retryAfterSeconds: { type: integer, minimum: 0 }
    OtpRequestEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/OtpRequestAccepted' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^\d{6}$' }
    AccessGrant:
      type: object
      required: [roleCode, permissions, scopeType, scopeId, expiresAt]
      properties:
        roleCode: { type: string }
        permissions:
          type: array
          items: { type: string }
        scopeType:
          type: string
          enum: [GLOBAL, CITY, OPERATIONAL_ZONE, BAKERY_BRANCH, COURIER_PARTNER, SELF]
        scopeId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: [string, 'null']
          format: date-time
    SessionContext:
      type: object
      required: [accountId, customerId, expiresAt, grants]
      properties:
        accountId: { type: string, format: uuid }
        customerId:
          type: [string, 'null']
          format: uuid
        expiresAt: { type: string, format: date-time }
        grants:
          type: array
          items: { $ref: '#/components/schemas/AccessGrant' }
    SessionEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/SessionContext' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ProductSummary:
      type: object
      required:
        [id, offeringId, variantId, sku, nameFa, fulfillmentClass, freshnessClaim, price, lifecycle]
      properties:
        id: { type: string, format: uuid }
        offeringId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        nameFa: { type: string }
        fulfillmentClass:
          type: string
          enum:
            [
              SIGNATURE_FRESH,
              PACKAGED_TRADITIONAL,
              PACKAGED_FANTASY,
              PACKAGED_DIETARY,
              LIMITED_EDITION,
            ]
        freshnessClaim:
          type: string
          enum: [FRESHLY_PRODUCED, PACKAGED, SHELF_STABLE, NONE]
        price: { $ref: '#/components/schemas/Money' }
        bakeryBranchId: { type: string, format: uuid }
        mediaRef: { type: string }
        lifecycle: { type: string, enum: [DRAFT, ACTIVE, SUSPENDED, RETIRED] }
    CatalogPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        meta:
          allOf:
            - { $ref: '#/components/schemas/ResponseMeta' }
            - type: object
              required: [pagination]
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    CartItemMutation:
      type: object
      required: [cityId, operationalZoneId, quantity]
      properties:
        cityId: { type: string, format: uuid }
        operationalZoneId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        expectedCartVersion: { type: integer, minimum: 1 }
    CartItemRemoval:
      type: object
      properties:
        expectedCartVersion: { type: integer, minimum: 1 }
    QuoteCreate:
      type: object
      required: [deliveryAddressId, expectedCartVersion, idempotencyKey]
      properties:
        deliveryAddressId: { type: string, format: uuid }
        expectedCartVersion: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
    CommerceItemSnapshot:
      type: object
      required:
        [
          id,
          bakeryProductOfferingId,
          productVariantId,
          bakeryBranchId,
          sku,
          nameFa,
          fulfillmentClass,
          freshnessClaim,
          quantity,
          unitPrice,
          lineTotal,
        ]
      properties:
        id: { type: string, format: uuid }
        bakeryProductOfferingId: { type: string, format: uuid }
        productVariantId: { type: string, format: uuid }
